version: '3.8'

services:
  # 1. Redis：兼任 Celery 任務佇列與 RAG 答案快取
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 2. ChromaDB：獨立分散式的向量資料庫服務
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index
    restart: always

  # 3. Ollama：負責地端輕量 LLM 推理 (本機版專用)
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  # 4. FastAPI Backend：負責問答路由、Chroma 檢索與 Reranker 計算
  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: rag_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DET_MODEL=                 # 切換 PaddleOCR的 為 輕量版
      - REC_MODEL=                 # 切換 PaddleOCR的 為 輕量版
      - CHROMA_URL=http://chromadb:8000
      - OLLAMA_URL=http://ollama:11434
      - RERANKER_DEVICE=cpu        # 💡 本機設為 cpu，減少VRAM使用量
      - LLM_MODEL_NAME=llama3.2-taiwan:1b # LLM 模型從 3B換成 1B 版本，減少 VRAM 使用量
    volumes:
      - ./storage:/app/storage     # Bind Mount 硬碟中 storage資料夾
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - chromadb
      - ollama
    restart: always

  # 5. Celery Worker：負責後台非同步執行重型的 PDF 解析 (pdfplumber + PaddleOCR)
  celery_worker:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: rag_worker
    # 💡 地端關鍵優化：-c 1 限制單一線程排隊，防止多圖同時解析瞬間擠爆 4G VRAM
    command: celery -A celery_app worker --loglevel=info -c ${CELERY_CONCURRENCY:-1} 
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DET_MODEL=
      - REC_MODEL=
      - CHROMA_URL=http://chromadb:8000
      - OCR_USE_GPU=True          # 💡 允許 PaddleOCR 使用 Mobile 版少量的 GPU VRAM
    volumes:
      - ./storage:/app/storage    # Bind Mount 硬碟中 storage資料夾
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - chromadb
    restart: always

  # 6. Streamlit Frontend：使用者操作介面
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: rag_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

# Named Volumes 讀取速度比Bind Mount快，適合存:redis語意快取, embedding, model weight
volumes:
  redis_data:
  chroma_data:
  ollama_data:
  hf_cache: